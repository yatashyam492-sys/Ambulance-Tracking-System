<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .navbar-brand{
            font-weight:bold;
        }

        .btn{
            margin:8px;
            min-width:180px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand" href="#">
            🚑 Ambulance Tracking System
        </a>

        <a href="{% url 'logout' %}" class="btn btn-light">
            Logout
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Welcome to Dashboard
    </h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card bg-primary text-white">
                <div class="card-body text-center">
                    <h5>Total Ambulances</h5>
                    <h1>{{ total }}</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-success text-white">
                <div class="card-body text-center">
                    <h5>Available Ambulances</h5>
                    <h1>{{ available }}</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-warning text-dark">
                <div class="card-body text-center">
                    <h5>Busy Ambulances</h5>
                    <h1>{{ busy }}</h1>
                </div>
            </div>
        </div>

    </div>

    <hr class="my-5">

    <div class="text-center">

        <a href="{% url 'register' %}" class="btn btn-primary btn-lg">
            Register Ambulance
        </a>

        <a href="{% url 'ambulance_list' %}" class="btn btn-success btn-lg">
            View Ambulances
        </a>

        <a href="{% url 'book_ambulance' %}" class="btn btn-danger btn-lg">
            Emergency Booking
        </a>

        <a href="{% url 'booking_history' %}" class="btn btn-info btn-lg">
            Booking History
        </a>

    </div>

</div>

</body>
</html>
