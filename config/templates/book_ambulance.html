<!DOCTYPE html>
<html>
<head>
    <title>Emergency Ambulance Booking</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:400px;
            margin:60px auto;
            background:#fff;
            padding:30px;
            border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#d32f2f;
            margin-bottom:20px;
        }

        p{
            margin-bottom:15px;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#d32f2f;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#b71c1c;
        }

        .back{
            text-align:center;
            margin-top:20px;
        }

        .back a{
            text-decoration:none;
            color:#d32f2f;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="container">

    <h2>🚑 Emergency Ambulance Booking</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Book Ambulance</button>
    </form>

    <div class="back">
        <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
    </div>

</div>

</body>
</html>
